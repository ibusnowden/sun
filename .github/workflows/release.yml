name: release

# A release is a tag. Pushing `v0.2.0` publishes 0.2.0 to npm and attaches a
# Linux binary to the GitHub release; nothing else publishes, so the tag is the
# only way a version reaches users.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      # The tag and the manifest must agree, or `sun --version` and the update
      # check would disagree with the registry for the life of the release.
      - name: Verify the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(bun --print 'require("./package.json").version')"
          if [ "$tagged" != "$packaged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $packaged" >&2
            exit 1
          fi

      # Also runs on prepack, but failing here keeps a broken build from ever
      # reaching the publish step.
      - run: bun run check

      - run: bun run build

      - name: Publish to npm
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach the Linux binary to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sun
          generate_release_notes: true
